<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Aerial 遥控</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #161a23;
    --card2: #1d222d;
    --line: #2a303d;
    --ink: #f2f4f8;
    --dim: #98a1b3;
    --accent: #5b9dff;
    --ok: #37c07a;
    --warn: #e8a13a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  body { padding: 14px 14px 170px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 2px; font-weight: 600; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
  .pad .key { height: 84px; }
  .pad .key.mid { height: 84px; }

  .key { display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    color: var(--ink); font-size: 15px; font-weight: 500; user-select: none;
    transition: transform .06s, background .12s; cursor: pointer; }
  .key:active, .key.hit { background: var(--accent); border-color: var(--accent); color: #06101f; transform: scale(.96); }
  .key.ghost { background: transparent; border-color: transparent; }
  .key.round { border-radius: 50%; }
  .key small { font-size: 11px; color: var(--dim); display: block; font-weight: 400; }
  .key:active small, .key.hit small { color: #06101f; }

  .row { display: grid; gap: 10px; margin-bottom: 10px; }
  .row.c2 { grid-template-columns: 1fr 1fr; }
  .row.c3 { grid-template-columns: repeat(3, 1fr); }
  .row .key { height: 56px; }

  h2 { font-size: 13px; color: var(--dim); font-weight: 500; margin: 22px 0 8px; letter-spacing: .04em; }

  .field { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 16px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  button { background: var(--accent); color: #06101f; border: 0; border-radius: 12px;
    padding: 0 18px; height: 48px; font-size: 15px; font-weight: 600; }
  button.plain { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  button:active { opacity: .75; }
  /* Typing stays put: the field has to be reachable wherever the page is scrolled to, and a
     history long enough to scroll would otherwise take it off the bottom of the screen. */
  .compose { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    max-width: 480px; margin: 0 auto;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
  .compose h2 { margin: 0 0 8px; }

  .edits { margin-top: 8px; }
  .edits button { height: 44px; padding: 0; font-size: 14px; font-weight: 500; }

  .histHead { display: flex; align-items: center; justify-content: space-between; }
  .histHead h2 { margin: 22px 0 8px; }
  .histHead button { height: 30px; padding: 0 12px; font-size: 12.5px; font-weight: 500;
    border-radius: 9px; }
  .hist { display: flex; flex-direction: column; gap: 8px; }
  .hist .item { display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 0 6px 0 13px; }
  .hist .text { flex: 1; min-width: 0; padding: 12px 0; font-size: 14.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist .when { color: var(--dim); font-size: 11.5px; flex: none; }
  .hist .del { flex: none; width: 32px; height: 32px; border-radius: 9px; background: transparent;
    color: var(--dim); font-size: 18px; font-weight: 400; padding: 0; line-height: 1; }
  .hist .del:active { background: var(--card2); color: var(--ink); }
  .hist .empty { color: var(--dim); font-size: 12.5px; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #eef2fb; color: #0b0d12; padding: 10px 18px; border-radius: 22px;
    font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: .96; }
</style>
</head>
<body>

<div class="pad">
  <div class="key ghost"></div>
  <div class="key" data-key="Up">▲</div>
  <div class="key ghost"></div>
  <div class="key" data-key="Left">◀</div>
  <div class="key round" data-key="Ok">OK</div>
  <div class="key" data-key="Right">▶</div>
  <div class="key ghost"></div>
  <div class="key" data-key="Down">▼</div>
  <div class="key ghost"></div>
</div>

<div class="row c3">
  <div class="key" data-key="Back">返回</div>
  <div class="key" data-key="Home">主页</div>
  <div class="key" data-key="Menu">菜单</div>
</div>

<div class="row c2">
  <div class="key" data-key="VolumeDown">音量 −</div>
  <div class="key" data-key="VolumeUp">音量 ＋</div>
</div>

<div class="row c3">
  <div class="key" data-act="brightness">亮度</div>
  <div class="key" data-act="hdmi1">HDMI 1</div>
  <div class="key" data-act="hdmi2">HDMI 2</div>
</div>

<div class="compose">
  <h2>打字</h2>
  <div class="field">
    <input id="text" type="text" placeholder="输入后点发送" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="send">发送</button>
  </div>
  <div class="row c2 edits">
    <button class="plain" id="backspace">退格</button>
    <button class="plain" id="clear">清空</button>
  </div>
</div>

<div class="histHead">
  <h2>输入历史</h2>
  <button class="plain" id="histClear" hidden>清空</button>
</div>
<div class="hist" id="history"></div>

<h2>配置</h2>
<div class="row c2">
  <button class="plain" id="export">导出配置</button>
  <button class="plain" id="import">导入配置</button>
</div>
<input id="file" type="file" accept=".json,application/json" hidden>

<div class="toast" id="toast"></div>

<script>
(function () {
  var base = location.pathname.replace(/\/remote$/, '/');
  var toastEl = document.getElementById('toast');
  var textEl = document.getElementById('text');
  var sendBtn = document.getElementById('send');

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  function form(url, data) {
    var body = new URLSearchParams();
    Object.keys(data).forEach(function (k) { body.append(k, data[k]); });
    return fetch(base + url, { method: 'POST', body: body }).then(function (r) { return r.json(); });
  }

  function press(key) {
    form('api/remote/key', { key: key }).catch(function () { toast('没连上电视'); });
  }

  // Only the field and 发送 keep the keyboard; every other press gives the field up first, or
  // the keyboard covers half the page for nothing.
  document.addEventListener('pointerdown', function (e) {
    if (e.target === textEl || sendBtn.contains(e.target)) return;
    if (document.activeElement === textEl) textEl.blur();
  }, true);

  document.querySelectorAll('[data-key]').forEach(function (el) {
    var key = el.dataset.key;
    var hold, repeat;
    function stop() {
      clearTimeout(hold); clearInterval(repeat);
      el.classList.remove('hit');
    }
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      el.classList.add('hit');
      press(key);
      // Holding a direction walks a grid faster than tapping; the others fire once.
      if (key === 'Up' || key === 'Down' || key === 'Left' || key === 'Right') {
        hold = setTimeout(function () {
          repeat = setInterval(function () { press(key); }, 130);
        }, 420);
      }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { el.addEventListener(ev, stop); });
  });

  // Not keys: routes the remote's side button takes, replayed as their own key sequences.
  var ACTS = { brightness: 'api/remote/brightness', hdmi1: 'api/remote/hdmi1', hdmi2: 'api/remote/hdmi2' };
  document.querySelectorAll('[data-act]').forEach(function (el) {
    var url = ACTS[el.dataset.act];
    if (!url) return;
    var busy = false;
    el.addEventListener('click', function () {
      if (busy) return;
      busy = true;
      el.classList.add('hit');
      setTimeout(function () { el.classList.remove('hit'); }, 200);
      form(url, { t: '1' }).then(function (s) {
        if (!s.opened) toast('需要 adb 通道才能操作');
      }).catch(function () { toast('没连上电视'); })
        .then(function () { busy = false; });
    });
  });

  sendBtn.addEventListener('click', function () {
    var text = textEl.value;
    if (!text) return;
    form('api/remote/text', { text: text }).then(function (s) {
      if (s.written) { toast('已输入'); textEl.value = ''; loadHistory(); }
      else toast('电视上没有可写的输入框');
    }).catch(function () { toast('没连上电视'); });
  });

  // Editing what is already in the TV's field. Sending replaces the whole text, so one wrong
  // character could only be fixed by retyping everything before these two buttons existed.
  function edit(url) {
    return form(url, { t: '1' }).then(function (s) {
      if (!s.written) toast('电视上没有可写的输入框');
      return !!s.written;
    }).catch(function () { toast('没连上电视'); return false; });
  }

  var back = document.getElementById('backspace');
  var backHold, backRepeat;
  function backOnce() {
    edit('api/remote/backspace').then(function (ok) {
      // Keep the box in step with the TV so the next send does not put the text back.
      if (ok && textEl.value) textEl.value = textEl.value.slice(0, -1);
    });
  }
  back.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    backOnce();
    // Holding it takes a long word apart faster than tapping; the field itself is the source of
    // truth, so nothing is lost if a repeat lands on an empty field.
    backHold = setTimeout(function () { backRepeat = setInterval(backOnce, 180); }, 500);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    back.addEventListener(ev, function () { clearTimeout(backHold); clearInterval(backRepeat); });
  });

  document.getElementById('clear').addEventListener('click', function () {
    edit('api/remote/clear').then(function (ok) { if (ok) textEl.value = ''; });
  });

  // What was sent before, newest first, so a word typed once does not have to be spelled out
  // again with a remote. The list lives on the TV, so it follows the viewer between phones.
  var histEl = document.getElementById('history');
  var histClear = document.getElementById('histClear');

  function stamp(ms) {
    var d = new Date(ms || Date.now());
    var now = new Date();
    var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    if (d.toDateString() === now.toDateString()) return hm;
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
  }

  function drawHistory(items) {
    histEl.textContent = '';
    histClear.hidden = !items.length;
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有发送过的内容。';
      histEl.appendChild(empty);
      return;
    }
    items.forEach(function (it) {
      var row = document.createElement('div');
      row.className = 'item';

      var text = document.createElement('div');
      text.className = 'text';
      // textContent, never innerHTML: this is whatever was typed, brackets and all.
      text.textContent = it.text;
      text.addEventListener('click', function () {
        textEl.value = it.text;
        toast('已填入，点发送');
      });

      var when = document.createElement('div');
      when.className = 'when';
      when.textContent = stamp(it.at);

      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', '删除这条');
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        form('api/remote/history/delete', { text: it.text })
          .then(function (s) { drawHistory(s.items || []); })
          .catch(function () { toast('没连上电视'); });
      });

      row.appendChild(text);
      row.appendChild(when);
      row.appendChild(del);
      histEl.appendChild(row);
    });
  }

  function loadHistory() {
    fetch(base + 'api/remote/history').then(function (r) { return r.json(); })
      .then(function (s) { drawHistory(s.items || []); })
      .catch(function () { /* the poll above already says whether the TV is reachable */ });
  }

  histClear.addEventListener('click', function () {
    form('api/remote/history/clear', { t: '1' })
      .then(function (s) { drawHistory(s.items || []); toast('历史已清空'); })
      .catch(function () { toast('没连上电视'); });
  });

  document.getElementById('export').addEventListener('click', function () {
    location.href = base + 'api/config/export';
    toast('开始下载');
  });

  var file = document.getElementById('file');
  document.getElementById('import').addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () {
    var f = file.files && file.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      form('api/config/import', { json: reader.result }).then(function (s) {
        if (s.applied > 0) toast('已导入 ' + s.applied + ' 项');
        else toast('文件读不懂');
      }).catch(function () { toast('导入失败'); });
    };
    reader.readAsText(f);
    file.value = '';
  });

  loadHistory();
})();
</script>
</body>
</html>
